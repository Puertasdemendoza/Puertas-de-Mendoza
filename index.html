<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puertas</title>
<style>
  :root{
    --bg: #ffffff;
    --plate: #171512;
    --plate-dark: #ece7dd;
    --rust: #a8592f;
    --patina: #5c7a68;
    --text: #171512;
    --muted: #9a948a;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  @font-face{
    font-family:'Fraunces';
    src: local('Fraunces');
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Courier New', 'Space Mono', monospace;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
  }

  /* portada */
  .intro{
    position:fixed;
    inset:0;
    background:var(--bg);
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity .8s ease;
  }
  .intro.hide{
    opacity:0;
    pointer-events:none;
  }
  .intro-text{
    font-family:'Georgia', 'Fraunces', serif;
    font-size:clamp(38px, 8vw, 84px);
    letter-spacing:0.22em;
    color:var(--text);
    cursor:pointer;
    padding-left:0.22em; /* compensa el letter-spacing visualmente */
    user-select:none;
    transition:opacity .3s ease;
  }
  .intro-text:hover{ opacity:0.6; }

  .main-page{
    width:100%;
    display:none;
  }
  .main-page.show{ display:block; }

  /* corner mark */
  .mark{
    position:fixed;
    top:22px;
    left:22px;
    z-index:50;
    font-family:'Georgia', 'Fraunces', serif;
    font-size:15px;
    letter-spacing:0.12em;
    color:var(--text);
    pointer-events:none;
  }
  .mark span{
    display:block;
    font-family:'Courier New', monospace;
    font-size:9px;
    color:var(--muted);
    letter-spacing:0.2em;
    margin-top:2px;
    mix-blend-mode:normal;
  }

  .count{
    position:fixed;
    top:22px;
    right:22px;
    z-index:50;
    font-size:10px;
    letter-spacing:0.15em;
    color:var(--muted);
    text-align:right;
  }
  .count b{ color:var(--text); font-weight:normal; }

  .music-btn{
    position:fixed;
    bottom:22px;
    right:22px;
    z-index:50;
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid var(--muted);
    background:transparent;
    color:var(--text);
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0.55;
    transition:opacity .3s ease;
  }
  .music-btn:hover{ opacity:1; }

  /* fila de puertas */
  .grid{
    display:flex;
    flex-direction:row;
    align-items:center;
    width:100%;
    gap:18px;
    padding:2px 24px 40px 24px;
    overflow-x:auto;
    cursor:grab;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .grid::-webkit-scrollbar{ display:none; }
  .grid.dragging{ cursor:grabbing; }

  .door-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:1 1 0;
    min-width:110px;
  }

  .slot{
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .slot.top{ justify-content:flex-end; }
  .slot.bottom{ justify-content:space-between; }

  .stem{
    width:1px;
    background:var(--muted);
    flex:0 0 auto;
    height:26px;
  }

  .loc-label{
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    font-size:9.5px;
    letter-spacing:0.12em;
    color:var(--muted);
    text-transform:uppercase;
    white-space:nowrap;
    padding:6px 0;
  }

  .door{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    overflow:hidden;
    cursor:pointer;
    background:#e9e5db;
  }

  .door img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:saturate(0.96) contrast(1.03);
    transition:transform 1.1s cubic-bezier(.16,.84,.44,1), filter .6s ease;
  }
  .door:hover img{
    transform:scale(1.045);
    filter:saturate(1.05) contrast(1.05);
  }

  /* lightbox */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(10,9,8,0.96);
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:14px;
    padding:16px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{
    max-width:96vw;
    max-height:90vh;
    width:auto;
    height:auto;
    object-fit:contain;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .lightbox .info{
    display:flex;
    gap:14px;
    align-items:baseline;
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--muted);
  }
  .lightbox .info .num{ color:var(--text); }
  .lightbox .close{
    position:absolute;
    top:24px;
    right:28px;
    font-size:13px;
    color:var(--muted);
    cursor:pointer;
    letter-spacing:0.1em;
  }
  .lightbox .close:hover{ color:var(--text); }
  .lightbox .nav{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    font-size:22px;
    color:var(--muted);
    cursor:pointer;
    padding:20px;
    user-select:none;
  }
  .lightbox .nav:hover{ color:var(--text); }
  .nav.prev{ left:6px; }
  .nav.next{ right:6px; }

  @media (prefers-reduced-motion: reduce){
    .door img, .plate{ transition:none; }
  }
</style>
</head>
<body>

  <div class="intro" id="intro">
    <div class="intro-text" id="introText">PUERTAS</div>
  </div>

  <div class="main-page" id="mainPage">

  <div class="mark">P.<span>INTERVENIDAS</span></div>
  <div class="count"><b id="countNow">01</b> / <span id="countTotal">12</span></div>

  <audio id="bgMusic" loop>
    <source src="Musica/tema.mp3" type="audio/mpeg">
  </audio>
  <button class="music-btn" id="musicBtn" aria-label="Reproducir música">♪</button>

  <div class="grid" id="grid"></div>

  <div class="lightbox" id="lightbox">
    <div class="close" id="closeBtn">CERRAR ✕</div>
    <div class="nav prev" id="prevBtn">‹</div>
    <div class="nav next" id="nextBtn">›</div>
    <img id="lightboxImg" src="" alt="">
    <div class="info">
      <span class="num" id="lightboxNum"></span>
      <span id="lightboxLoc"></span>
    </div>
  </div>

  </div><!-- /main-page -->

<script>
  // ---------------------------------------------------------
  // REEMPLAZÁ ESTE ARRAY CON TUS PUERTAS REALES.
  // src: url o ruta de la imagen
  // loc: ubicación o dato breve (podés dejarlo vacío: "")
  // ---------------------------------------------------------
  const doors = [
    { src: "Fotos/P01.png", loc: "San Rafael" },
    { src: "Fotos/P02.png",  loc: "Bombal, Godoy Cruz" },
    { src: "Fotos/P03.png",  loc: "Bombal, Godoy Cruz" },
    { src: "Fotos/P04.png", loc: "Bombal, Godoy Cruz" },
    { src: "Fotos/P05.png",  loc: "San Rafael" },
    { src: "Fotos/P06.png", loc: "Bombal, Godoy Cruz" },
    { src: "Fotos/P07.png",  loc: "San Rafael" },
    { src: "Fotos/P08.png", loc: "Real del Padre" },
    { src: "Fotos/P09.png",  loc: "La Consulta, San Carlos" },
    { src: "Fotos/P10.png",loc: "La Consulta, San Carlos" },
    { src: "Fotos/P11.png", loc: "Bombal, Godoy Cruz" },
    { src: "Fotos/P12.png", loc: "Bombal, Godoy Cruz" },
    { src: "Fotos/P13.png", loc: "San Rafael" },
    { src: "Fotos/P14.png", loc: "San Rafael" },
    { src: "Fotos/P15.png", loc: "San Rafael" },
  ];

  const grid = document.getElementById('grid');
  const pad = n => String(n).padStart(2, '0');

  doors.forEach((d, i) => {
    const col = document.createElement('div');
    col.className = 'door-col';

    const topSlot = document.createElement('div');
    topSlot.className = 'slot top';
    const bottomSlot = document.createElement('div');
    bottomSlot.className = 'slot bottom';

    if (d.loc) {
      bottomSlot.innerHTML = `<div class="stem"></div><div class="loc-label">${d.loc}</div>`;
    }

    const doorEl = document.createElement('div');
    doorEl.className = 'door';
    doorEl.innerHTML = `<img src="${d.src}" alt="Puerta ${pad(i+1)}" loading="lazy">`;
    doorEl.addEventListener('click', () => openLightbox(i));

    col.appendChild(topSlot);
    col.appendChild(doorEl);
    col.appendChild(bottomSlot);
    grid.appendChild(col);
  });

  document.getElementById('countTotal').textContent = pad(doors.length);

  // justificar todas las etiquetas a la misma línea de base
  const STEM_H = 26;
  let maxLabelH = 0;
  document.querySelectorAll('.loc-label').forEach(l => {
    maxLabelH = Math.max(maxLabelH, l.offsetHeight);
  });
  const slotH = STEM_H + maxLabelH;
  document.querySelectorAll('.slot.bottom').forEach(s => {
    if (s.children.length) s.style.height = slotH + 'px';
  });

  // --- desplazamiento horizontal limpio (sin scrollbar visible) ---

  // rueda del mouse (vertical) mueve la fila horizontalmente
  grid.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      e.preventDefault();
      grid.scrollLeft += e.deltaY;
    }
  }, { passive: false });

  // arrastrar con el mouse (click + mover)
  let isDown = false;
  let startX = 0;
  let startScroll = 0;

  grid.addEventListener('mousedown', (e) => {
    isDown = true;
    grid.classList.add('dragging');
    startX = e.pageX;
    startScroll = grid.scrollLeft;
  });
  window.addEventListener('mouseup', () => {
    isDown = false;
    grid.classList.remove('dragging');
  });
  window.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    grid.scrollLeft = startScroll - (e.pageX - startX);
  });

  // flechas del teclado: si el lightbox está cerrado, mueven la fila
  document.addEventListener('keydown', (e) => {
    if (lightbox.classList.contains('open')) return;
    if (e.key === 'ArrowRight') grid.scrollBy({ left: 220, behavior: 'smooth' });
    if (e.key === 'ArrowLeft') grid.scrollBy({ left: -220, behavior: 'smooth' });
  });

  // música de fondo
  const bgMusic = document.getElementById('bgMusic');
  const musicBtn = document.getElementById('musicBtn');
  let playing = false;

  musicBtn.addEventListener('click', () => {
    if (playing) {
      bgMusic.pause();
      musicBtn.textContent = '♪';
    } else {
      bgMusic.play().catch(() => {});
      musicBtn.textContent = '❚❚';
    }
    playing = !playing;
  });

  // portada: al tocar "PUERTAS" entra a la galería y arranca la música
  const intro = document.getElementById('intro');
  const introText = document.getElementById('introText');
  const mainPage = document.getElementById('mainPage');

  introText.addEventListener('click', () => {
    mainPage.classList.add('show');
    intro.classList.add('hide');

    bgMusic.play().then(() => {
      playing = true;
      musicBtn.textContent = '❚❚';
    }).catch(() => {});

    setTimeout(() => { intro.style.display = 'none'; }, 800);
  });

  // lightbox
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lightboxImg');
  const lbNum = document.getElementById('lightboxNum');
  const lbLoc = document.getElementById('lightboxLoc');
  const countNow = document.getElementById('countNow');
  let current = 0;

  function openLightbox(i){
    current = i;
    render();
    lightbox.classList.add('open');
  }
  function render(){
    const d = doors[current];
    lbImg.src = d.src;
    lbImg.alt = `Puerta ${pad(current+1)}`;
    lbNum.textContent = pad(current+1);
    lbLoc.textContent = d.loc || '';
    countNow.textContent = pad(current+1);
  }
  function closeLightbox(){ lightbox.classList.remove('open'); }
  function next(){ current = (current+1) % doors.length; render(); }
  function prev(){ current = (current-1+doors.length) % doors.length; render(); }

  document.getElementById('closeBtn').addEventListener('click', closeLightbox);
  document.getElementById('nextBtn').addEventListener('click', next);
  document.getElementById('prevBtn').addEventListener('click', prev);
  lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if(!lightbox.classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowRight') next();
    if(e.key === 'ArrowLeft') prev();
  });
</script>
</body>
</html>
